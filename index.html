<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d40"><meta name="description" content="فضاء الثانوية التأهيلية الوفاق: الإعلانات والأندية والأنشطة المدرسية">
  <link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
  <title>فضاء الثانوية التأهيلية الوفاق | Al Wifaq School Hub</title>
</head>
<body>
  <div class="app-shell">
      <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home"><span class="brand-mark">م</span><span><b data-i="brand">فضاء الثانوية</b><small data-i="brandSub">الحياة المدرسية بين يديك</small></span></a>
      <nav id="mainNav" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><span>⌂</span><span data-i="navHome">الرئيسية</span></button>
        <button class="nav-item" data-view="news"><span>▤</span><span data-i="navNews">الإعلانات والأخبار</span></button>
        <button class="nav-item" data-view="clubs"><span>✳</span><span data-i="navClubs">الأندية</span></button>
        <button class="nav-item" data-view="activities"><span>◷</span><span data-i="navActivities">الأنشطة</span></button>
        <button class="nav-item" data-view="student"><span>◎</span><span data-i="studentSpace">فضائي</span></button>
        <button class="nav-item" data-view="projects"><span>▣</span><span data-i="projects">المشاريع الثقافية</span></button>
        <button class="nav-item" data-view="tracking"><span>▥</span><span data-i="tracking">تتبع الأنشطة والمؤشرات</span></button>
        <button class="nav-item" data-view="gallery"><span>▧</span><span data-i="gallery">معرض الصور والفيديوهات</span></button>
        <button class="nav-item" data-view="dashboard"><span>▦</span><span data-i="navDashboard">لوحة التدبير</span><span class="nav-count" id="pendingCount">0</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="sync-state"><i></i><span data-i="localMode">حفظ محلي على هذا الجهاز</span></div><button id="installBtn" class="install-btn hidden" data-i="install">تثبيت التطبيق</button><small>Al Wifaq · v3.2.0</small></div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="crumb"><span data-i="brand">فضاء الثانوية</span><b>/</b><strong id="pageTitle" data-i="navHome">الرئيسية</strong></div>
        <div class="top-actions"><div class="language-switch" role="group" aria-label="Language"><button data-lang="ar" class="selected">ع</button><button data-lang="fr">FR</button><button data-lang="en">EN</button></div><button class="avatar" id="roleBtn" title="Demo role">م</button></div>
      </header>
      <div class="content" id="viewRoot"></div>
      <footer><span data-i="footer">منصة الحياة المدرسية</span><span>·</span><span data-i="footerCredit">نموذج أولي قابل للتطوير</span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="modal" class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" data-close>×</button></div><div id="modalBody"></div></dialog>
  <script src="backend-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js" defer></script>
</body>
</html>
